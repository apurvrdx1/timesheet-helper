name: Deploy to GitHub Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npm run typecheck
      # Replaces `npm test`, not just adds to it: `coverage` runs the exact
      # same vitest suite with v8 instrumentation and then enforces
      # vitest.config.ts's thresholds (80 lines/functions/statements, 75
      # branches), failing the job — and blocking deploy — if either the
      # tests or the coverage bar fail. Running `npm test` first would only
      # duplicate the whole suite for no extra signal.
      - run: npm run coverage
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: ./dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
